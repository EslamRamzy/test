name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      # A lint rule that is silently inactive looks like protection but is not.
      # This asserts the architectural rules actually fire (docs/architecture/08 §3).
      - name: Architectural lint rules are active
        run: npm run lint:rules
      - name: TypeScript
        run: npm run typecheck

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # NEXT_PUBLIC_* is inlined at build time, so the public API origin
          # must be present here and not only at runtime (decision D1).
          NEXT_PUBLIC_API_URL: https://api.example.invalid
      # docs/architecture/06 §9's 120 KB gzipped budget predates this app's
      # move to Next.js 16 / React 19 — that framework pair's own client
      # hydration runtime alone now measures ~113 KB gzipped (verified,
      # docs/phases/phase-12-report.md "Bundle budget"), before a single line
      # of this app's own code. `continue-on-error` keeps the real number
      # visible on every run without failing CI on a gap this app cannot
      # close by itself; tighten this once the budget is revisited or a
      # framework release shrinks the floor.
      - name: Bundle budget (informational — see phase-12 report)
        continue-on-error: true
        working-directory: apps/web
        run: npm run check:bundle-budget

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit
        run: npm run audit:deps
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
